<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twilight</title>
  <meta name="description" content="Apprendre l'anglais avec English Grammar in Use, English Vocabulary in Use et 150 proverbes.">
  <meta name="theme-color" content="#2B2A5C">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applique le thème choisi avant l'affichage (évite un flash de couleur).
    try { const t = JSON.parse(localStorage.getItem('twilight-progress') || '{}')?.settings?.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img class="brand-logo" src="favicon.svg" alt="">
      <span>Twilight</span>
    </a>
    <nav id="nav" aria-label="Navigation principale"></nav>
    <div id="streak" class="streak-badge" aria-label="Série de jours"></div>
    <button id="theme-toggle" class="theme-toggle" type="button"></button>
  </header>
  <main id="main" tabindex="-1">
    <div id="loading" class="loading"><div class="loading-sun"></div>Chargement de Twilight…</div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
